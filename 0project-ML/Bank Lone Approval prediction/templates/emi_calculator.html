<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>EMI Calculator</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />

  <style>
    :root{
      --bg:#081126;
      --bg2:#0b1633;
      --card:#1a2340;
      --line:rgba(255,255,255,.08);
      --text:#eef2ff;
      --muted:#b6c2e2;
      --accent1:#29d3ff;
      --accent2:#5b6cff;
    }

    *{ box-sizing:border-box; }
    body{
      margin:0;
      min-height:100vh;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color:var(--text);
      background:
        radial-gradient(900px 500px at 15% 0%, rgba(41,211,255,.18), transparent 45%),
        radial-gradient(800px 450px at 100% 0%, rgba(91,108,255,.18), transparent 40%),
        linear-gradient(160deg, var(--bg), var(--bg2));
    }

    .topbar{
      background: rgba(5,10,24,.88);
      border-bottom: 1px solid rgba(255,255,255,.06);
      backdrop-filter: blur(8px);
      min-height: 68px;
    }

    .brand{
      color:#fff;
      text-decoration:none;
      font-weight:800;
      letter-spacing:.2px;
    }

    .wrap{
      max-width: 920px;
      margin: 0 auto;
      padding: 40px 16px 56px;
    }

    .card-panel{
      background: linear-gradient(180deg, rgba(28,39,73,.96), rgba(20,29,57,.96));
      border: 1px solid var(--line);
      border-radius: 20px;
      box-shadow: 0 18px 50px rgba(0,0,0,.35);
      padding: 28px;
    }

    .title{
      font-size: 1.9rem;
      font-weight: 800;
      margin-bottom: 6px;
    }

    .subtitle{
      color:var(--muted);
      margin-bottom: 20px;
    }

    .form-label{
      color:#fff;
      font-weight:700;
      margin-bottom: 6px;
    }

    .form-control{
      height:46px;
      border-radius:12px;
      border: 1px solid rgba(255,255,255,.08);
      background:#f8fbff;
      color:#14203b;
    }

    .form-control:focus{
      border-color: rgba(41,211,255,.7);
      box-shadow: 0 0 0 .2rem rgba(41,211,255,.12);
    }

    .btn-calc{
      background: linear-gradient(90deg, var(--accent1), var(--accent2));
      border:none;
      color:#fff;
      font-weight:800;
      border-radius:12px;
      padding: 12px 22px;
    }

    .result-box{
      margin-top: 22px;
      padding: 20px;
      border-radius: 16px;
      background: rgba(255,255,255,.04);
      border: 1px solid rgba(255,255,255,.06);
    }

    .result-value{
      font-size: 2rem;
      font-weight: 800;
      color: #7ef0c2;
    }

    .note{
      color:var(--muted);
      font-size:.92rem;
      margin-top:8px;
    }
  </style>
</head>
<body>
  <nav class="navbar topbar">
    <div class="container">
      <a class="brand" href="/"><i class="bi bi-bank2 me-2"></i>Bank Loan Approval</a>
    </div>
  </nav>

  <main class="wrap">
    <section class="card-panel">
      <h1 class="title">EMI Calculator</h1>
      <p class="subtitle">Calculate your monthly installment instantly.</p>

      <div class="row g-3">
        <div class="col-md-4">
          <label class="form-label">Loan Amount</label>
          <input id="principal" type="number" class="form-control" placeholder="e.g. 500000" />
        </div>
        <div class="col-md-4">
          <label class="form-label">Interest Rate (%)</label>
          <input id="rate" type="number" class="form-control" placeholder="e.g. 9.5" step="0.01" />
        </div>
        <div class="col-md-4">
          <label class="form-label">Tenure (Months)</label>
          <input id="tenure" type="number" class="form-control" placeholder="e.g. 240" />
        </div>

        <div class="col-12 text-end pt-2">
          <button class="btn btn-calc" type="button" onclick="calculateEMI()">
            <i class="bi bi-calculator me-1"></i> Calculate EMI
          </button>
        </div>
      </div>

      <div class="result-box">
        <div class="d-flex justify-content-between flex-wrap gap-2">
          <div>
            <div class="note">Monthly EMI</div>
            <div id="emiResult" class="result-value">₹0</div>
          </div>
          <div>
            <div class="note">Total Payable</div>
            <div id="totalResult" class="result-value">₹0</div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script>
    function calculateEMI() {
      const p = parseFloat(document.getElementById("principal").value);
      const r = parseFloat(document.getElementById("rate").value);
      const n = parseFloat(document.getElementById("tenure").value);

      if (!p || !r || !n) {
        alert("Please enter all values");
        return;
      }

      const monthlyRate = r / (12 * 100);
      const emi = (p * monthlyRate * Math.pow(1 + monthlyRate, n)) / (Math.pow(1 + monthlyRate, n) - 1);
      const total = emi * n;

      document.getElementById("emiResult").innerText = "₹" + emi.toFixed(2);
      document.getElementById("totalResult").innerText = "₹" + total.toFixed(2);
    }
  </script>
</body>
</html>
